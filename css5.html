<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的故事小站</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&family=Roboto+Slab&family=Quicksand&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      margin: 0;
      background-color: #fff8e7;
    }
    header {
      background-color: #444;
      color: white;
      text-align: center;
      padding: 30px 10px;
      text-shadow: -2px -2px 4px #ad9090;
      font-size: 32px;
      letter-spacing: 2px;
      font-family: 'Roboto Slab', serif;
    }
    .container {
      display: flex;
    }
    .left {
      width: 35%;
      background-color: #1d8f69;
      padding: 15px;
      text-align: center;
      font-family: 'Quicksand', sans-serif;
    }
    .left img {
      width: 90%;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .right {
      width: 65%;
      display: flex;
      flex-wrap: wrap;
      background-color: #adbde0;
      padding: 10px;
    }
    .column {
      width: 50%;
      padding: 15px;
      box-sizing: border-box;
    }
    .column h3 {
      background-color: #cac6e4;
      padding: 6px;
      font-weight: bold;
      border-left: 5px solid #d8d0bf;
      font-family: 'Roboto Slab', serif;
    }
    .column p, .column ul {
      font-family: 'Noto Sans TC', sans-serif;
    }
  </style>
</head>
<body>
  <header>最近</header>
  <div class="container">
    <div class="left">
      <h3>陳凱威</h3>
      <img src="海.png" alt="海.png">
    </div>
    <div class="right">
      <div class="column">
        <h3>今天在幹嘛</h3>
        <p>在宿舍睡覺</p>
      </div>
      <div class="column">
        <h3>最近喜歡的東西</h3>
        <p>看劇</p>
      </div>
      <div class="column">
        <h3>暑假要做的事</h3>
        <ul>
          <li>出國</li>
          <li>跟朋友出去</li>
          <li>睡覺</li>
        </ul>
      </div>
      <div class="column">
        <h3>在台南去過哪裡</h3>
        <p>漁光島
        </p>
      </div>
    </div>
  </div>
</body>
</html>
